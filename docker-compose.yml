services:
  web:
    build: ./docker/php
    ports:
      - "8088:80"
    volumes:
      - ./src:/var/www
    environment:
      DB_HOST: db
      DB_NAME: oudegracht
      DB_USER: oudegracht
      DB_PASS: oudegracht_dev
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: oudegracht
      MYSQL_USER: oudegracht
      MYSQL_PASSWORD: oudegracht_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3307:3306"
    volumes:
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
